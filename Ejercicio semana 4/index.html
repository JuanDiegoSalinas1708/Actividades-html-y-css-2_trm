<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulario 
         Con Validacion Avanzada</title>
  <link rel="stylesheet" href="./_CSS/styles.css">
</head>
<body>

    <div class="container">
        <!--Barra de progreso-->
        <h1>🚀 Formulario Avanzado</h1>

        <div class="progreso-formulario">
            <div class="barra-progreso" id="barraProgreso"></div>
        </div>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            Progreso: <span id="porcentajeProgreso">0%</span>
        </p>

      <!--Form-->
    <form id="formularioAvanzado" novalidate>
        <!--Nombre-->
        <div class="form-group">
            <label for="nombre">Nombre*</label>
            <input 
            type="text"
            id="nombre"
            name="nombre"
            required
            autofocus
            placeholder="Ingresa tus Nombres"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,40}">
            <div 
                class="mensaje-error"
                id="errorNombre"></div>
            <div
                class="mensaje-exito"
                id="exitoNombre"></div>
        </div>


          <!--Apellido-->
          <div class="form-group">
            <label for="apellido">Apellido*</label>
            <input 
            type="text"
            id="apellifo"
            name="apellido"
            required
            autofocus
            placeholder="Ingresa tus Apellidos"
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,40}">
            <div 
                class="mensaje-error"
                id="errorApellido"></div>
            <div
                class="mensaje-exito"
                id="exitoApellido"></div>
        </div>

        <!--Email con validación personalizada-->
        <div class="form-group">
            <label for="correo">Correo electronico *</label>
            <input 
            type="email"
            id="correo"
            name="correo"
            required
            placeholder="usuario@dominio.com"
            pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$">
            <div 
                class="mensaje-error"
                id="errorCorreo"></div>
            <div
                class="mensaje-exito"
                id="exitoCorreo"></div>
        </div>

        <!--Confirmar Email-->

                <div class="form-group">
                    <label for="correo"> Confirmar Correo electronico *</label>
                    <input 
                    type="email"
                    id="correo"
                    name="correo"
                    required
                    placeholder="usuario@dominio.com"
                    pattern="^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$">
                    <div 
                        class="mensaje-error"
                        id="errorCorreo"></div>
                    <div
                        class="mensaje-exito"
                        id="exitoCorreo"></div>
                </div>

        <!--Contraseña indicador de fortaleza-->
        <div class="form-group">
            <label for="password">Contraseña *</label>
            <input 
            type="password"
            id="password"
            name="password"
            required
            placeholder="Minimo 8 caracteres"
            minlength="8">
            <div 
                class="mensaje-error"
                id="errorPassword"></div>
            <div
                class="mensaje-exito"
                id="exitoPassword"></div>
        </div>

        <!--Confirmacion de contraseña-->
        <div class="form-group">
            <label for="cofnrimarPassword">Confirmar contraseña *</label>
            <input 
            type="password"
            id="confirmarPassword"
            name="confirmarPassword"
            required
            placeholder="Repite tu contraseña">
            <div
                class="mensaje-error"
                id="errorConfirmar"></div>
            <div
                class="mensaje-exito"
                id="exitoConfirmar"></div>
        </div>

        <!--Telefono con formato-->
        <div class="form-group">
            <label for="telefono">Telefono *</label>
            <input 
            type="tel"
            id="telefono"
            name="telefono"
            required
            placeholder="300-123-4567"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
            <div
                class="mensaje-error"
                id="errorTelefono"></div>
            <div
                class="mensaje-exito"
                id="exitoTelefono"></div>
        </div>

        <!--Fecha de nacimiento-->
        <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento *</label>
            <input 
            type="date"
            id="fechaNacimiento"
            name="fechaNacimiento"
            required/>
            <div
                class="mensaje-error"
                id="errorFecha"></div>
            <div
                class="mensaje-exito"
                id="exitoFecha"></div>
        </div>

        <!--Comentarios con contador-->
        <div class="form-group">
            <label for="comentarios">Comentarios *</label>
        <textarea
            id="comentarios"
            name="comentarios"
            rows="4"
            maxlength="500"
            placeholder="Cuéntanos sobre ti (máximo 500 caracteres)"></textarea>
            <div class="contador-caracteres">
                <span id="contadorComentarios">0</span>/500 caracteres
            </div>
        </div>

        
        <!--Terminos y condiciones-->
        <div class="form-group">
            <input 
            type="checkbox"
            id="terminos"
            name="terminos"
            required/>
        <label 
        for="terminos"
        style="display: inline;margin-left: 8px;">
        Acepto los terminos y condicones *
        </label>
         <div
            class="mensaje-error"
            id="errorTerminos"></div>
        </div>

        <button
         type="submit"
         id="btnEnviar"
         disabled>
        📤Enviar Formulario
        </button>
    
        </form>
    </div>

   <!-- scripts -->
    <script src="./_JS/form.js"></script>
   
</body>
</html>
